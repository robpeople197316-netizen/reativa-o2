<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reativação</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:#0d0d0d;color:#f0f0f0;padding:16px;max-width:600px;margin:0 auto}
h1{font-size:20px;font-weight:700}h1 span{color:#c9a227}
.sub{font-size:12px;color:#777;margin-bottom:12px}
.bar{display:flex;gap:6px;margin-bottom:12px}
.stat{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:9px 3px;text-align:center}
.stat b{display:block;font-size:17px;color:#c9a227}
.stat small{font-size:8px;color:#888;text-transform:uppercase}
.prog{height:5px;background:#222;border-radius:3px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:#c9a227}

.card{background:#161616;border:1px solid #2a2a2a;border-radius:14px;padding:16px;margin-bottom:12px}
.card.sent{border-color:#3a4a2a}.card.done{opacity:.5}
.card.win{opacity:1;border-color:#3a6a44;background:#121a14}
.nome{font-size:17px;font-weight:600;margin-bottom:7px}
.badges{margin-bottom:8px}
.alert{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;margin-right:5px}
.a1{background:#4a1515;color:#ff8a8a}.a2{background:#4a3a15;color:#ffd98a}.a4{background:#1a2a3a;color:#8ab8de}
.a5{background:#2a2a2a;color:#999}
.tp{display:inline-block;font-size:10px;font-weight:600;padding:3px 7px;border-radius:5px;margin-right:5px}
.tp-mecha{background:#3a2a10;color:#e8c37a}.tp-cor{background:#2a1a3a;color:#c8a8e8}.tp-outro{background:#222;color:#888}
.sb{display:inline-block;background:#1a3320;color:#8ade9d;font-size:10px;font-weight:600;padding:3px 7px;border-radius:5px}
.hist{background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:10px;margin:10px 0}
.hist h4{font-size:10px;color:#666;text-transform:uppercase;margin-bottom:6px}
.hl{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:#aaa}
.hl.key{color:#c9a227;font-weight:600}.hl span:first-child{color:#666;font-size:11px}
.msg{background:#0a0a0a;border:1px solid #262626;border-radius:9px;padding:12px;font-size:13px;line-height:1.6;color:#ccc;margin:10px 0;white-space:pre-wrap}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{flex:1;min-width:70px;padding:10px 4px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.wa{background:#25d366;color:#000}.ok{background:#c9a227;color:#000}
.ad{background:#2a3a4a;color:#9ac8e8}.no{background:#2a2a2a;color:#999}
.wa2{background:#1a3a24;color:#8ade9d;border:1px solid #2a5a34}
.undo{background:none;border:1px solid #333;color:#666;font-size:11px;padding:6px;margin-top:8px;flex:0;min-width:66px}
.tag{font-size:11px;padding:5px 10px;border-radius:6px;display:inline-block;font-weight:600}
.t-ok{background:#1a3320;color:#8ade9d}.t-no{background:#331a1a;color:#e08a8a}
.t-ad{background:#1a2a3a;color:#8ab8de}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{flex:1;min-width:58px;padding:8px 2px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;text-align:center;font-size:10px;color:#999;cursor:pointer}
.tab.on{background:#c9a227;color:#000;font-weight:600}
.foot{margin-top:24px;padding-top:16px;border-top:1px solid #222}
.foot h3{font-size:11px;color:#888;margin-bottom:8px;text-transform:uppercase}
.foot button{width:100%;margin-bottom:8px;background:#1a1a1a;border:1px solid #333;color:#aaa;font-weight:400;font-size:12px}
textarea{width:100%;height:60px;background:#0a0a0a;border:1px solid #2a2a2a;color:#888;border-radius:8px;padding:10px;font-size:10px;font-family:monospace;margin-bottom:8px}
.locked{background:#12160e;border:1px solid #2a3a1a;border-radius:9px;padding:10px;font-size:11px;color:#9ac87a;margin-bottom:12px;line-height:1.5}

      hist+='<div class="hl'+(k?' key':'')+'"><span>'+h.d+'</span><span>'+h.s+'</span></div>';
    });
    hist+='</div>';
    var badges='<div class="badges">'+tipo(c)+'<span class="alert '+a[0]+'">'+a[1]+'</span>'+
      (s.e?'<span class="sb">✓ enviada</span>':'')+'</div>';
    var body;
    if(s.r){
      var t=s.r==='ok'?'<div class="tag t-ok">✓ Agendou</div>'
          :s.r==='ad'?'<div class="tag t-ad">⏸ Adiado — voltar a falar</div>'
          :'<div class="tag t-no">✕ Agora não</div>';
      body=t+'<div><button class="undo" onclick="reset('+i+')">Desfazer</button></div>';
    } else if(s.e){
      body=hist+'<div class="btns">'+
        '<button class="wa2" onclick="wa('+i+')">Reenviar</button>'+
        '<button class="ok" onclick="mk('+i+',\'ok\')">Agendou</button>'+
        '<button class="ad" onclick="mk('+i+',\'ad\')">Adiar</button>'+
        '<button class="no" onclick="mk('+i+',\'no\')">Agora não</button></div>';
    } else {
      body=hist+'<div class="msg">'+msg(c)+'</div>'+
        '<div class="btns"><button class="wa" onclick="wa('+i+')">Enviar no WhatsApp</button>'+
        '<button class="no" onclick="mk2('+i+')" style="flex:0;min-width:88px">Já mandei</button></div>';
    }
    d.innerHTML='<div class="nome">'+c.n+'</div>'+badges+body;
    L.appendChild(d);
  });
  if(!n) L.innerHTML='<div style="text-align:center;padding:40px;color:#555">Nada aqui.</div>';
}

 window.open('https://wa.me/'+D[i].f+'?text='+encodeURIComponent(msg(D[i])),'_blank');render()}
